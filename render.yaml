services:
  - type: web
    name: rooftop-solar-marketplace
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # ── Option 1: Railway/Render managed PostgreSQL ──────────────────────
      # Railway auto-injects DATABASE_URL. On Render, add a Postgres add-on
      # and it also injects DATABASE_URL automatically.
      - key: DATABASE_URL
        sync: false          # set automatically by Railway/Render postgres addon
      - key: DATABASE_SSLMODE
        value: "disable"     # Railway/Render managed DB does not need SSL

      # ── Option 2: AWS RDS (only if not using managed DB above) ───────────
      # Leave these blank if using DATABASE_URL above
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_NAME
        sync: false
      - key: DATABASE_SCHEMA
        value: "public"
      - key: DATABASE_READ_HOST
        sync: false

      # ── JWT ───────────────────────────────────────────────────────────────
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # ── App ───────────────────────────────────────────────────────────────
      - key: APP_NAME
        value: GreenGrid Energy Exchange
      - key: APP_VERSION
        value: 1.0.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: "*"

      # ── Blockchain ────────────────────────────────────────────────────────
      - key: BLOCKCHAIN_ENABLED
        value: "False"       # set True after Sepolia contract is deployed
      - key: BLOCKCHAIN_CONTRACT_ADDRESS
        sync: false
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: BLOCKCHAIN_NETWORK
        value: sepolia
      - key: BLOCKCHAIN_PRIVATE_KEY
        sync: false
